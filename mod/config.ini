[KeyboardLayoutFix]
; physical = every key acts by its position on a US keyboard (on QWERTZ the key
;            labeled Z acts as Y). Matches how most games' default bindings were designed.
; label    = letters keep what's printed on them; only the number row and punctuation are fixed.
Mode=physical

; 1 = log every key translation to KeyboardLayoutFix.log (next to this file).
Debug=0
